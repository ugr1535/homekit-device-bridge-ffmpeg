name: Publish Tested Camera Media Sources
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ugr1535/homekit-device-bridge-ffmpeg
      TEST_RUN: '41193477466'
      SOURCE_COMMIT: 2c4a5655b2d8cc866a29fdd8e1bc71f9d261827c
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify successful source build
        run: |
          test "$(gh run view "$TEST_RUN" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$TEST_RUN" --json headSha --jq .headSha)" = "$SOURCE_COMMIT"
          gh run download "$TEST_RUN" --name camera-ffmpeg-arm64 --dir release
          cd release
          sha256sum --strict -c SHA256SUMS
      - name: Publish matching sources and media component
        run: |
          test "$(gh api "repos/$GH_REPO/git/ref/tags/camera-ffmpeg-9.0.2-hdb3" --jq .object.sha)" = "$SOURCE_COMMIT"
          gh release create camera-ffmpeg-9.0.2-hdb3 --verify-tag --prerelease \
            --title 'Camera FFmpeg 9.0.2-hdb3: copy-only AAC audio and matching sources' \
            --notes-file RELEASE-NOTES.md \
            release/camera-ffmpeg-9.0.2-hdb3-corresponding-source.tar.gz \
            release/camera-ffmpeg-9.0.2-hdb3-linux-arm64.tar.gz \
            release/build-manifest.json release/smoke-result.json release/SHA256SUMS \
            release/THIRD_PARTY_NOTICES.md release/licenses/COPYING.GPLv3
